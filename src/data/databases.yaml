# Notion database mappings. IDs are not sensitive — only NOTION_API_KEY is secret.
#
# Notion's new data model: a database page can hold several "data sources"; page
# ids are NOT queryable — only data source ids are (verified against the live
# workspace via the search endpoint, 2026-03-11 API version). The Actores page
# holds an "Organizaciones" data source AND a separate "Personas" data source,
# so people never appear here. Persons are excluded at the data-source level.
#
# Queries run at Notion-Version 2026-03-11 (see src/lib/notion.ts); the SDK's
# default (2022-06-28) returns invalid_request_url for data_sources/views paths.

organizations:
  name: Actores
  database_id: 36c14415-10e1-802d-9864-e4a7d878e5e8
  # "Organizaciones" data source (252 rows at last check). The "Personas"
  # data source (3d414415-10e1-80ea-81e3-000b6cb1014c) is NOT queried.
  data_source_id: 36c14415-10e1-806c-bf67-000b85483116
  filters:
    # Only entities whose Escala is exactly this value appear on the map/gallery.
    escala_property: Escala
    escala_value: Altiplano Estepario
    # The data source is already the organization list — skip the type heuristic.
    assume_organization: true
  # Pinned from the build-time schema log (verified 2026-03-11).
  property_names:
    name: [Name]
    description: [Descripción]
    website: [Enlace]
    place: [Place]
    latitude: [location_lat]
    longitude: [location_lng]
    type: [Tipo de Estructura]
    grupoTrabajo: [Grupo de Trabajo]

interventions:
  name: Intervenciones
  database_id: 2f414415-10e1-80ff-bc2f-c1581274d40f
  # Queryable "Intervenciones" data source (58 rows; the database page id is
  # NOT queryable).
  data_source_id: 2f414415-10e1-8091-9a00-000bd9eee702
  # The gallery mirrors this view (its own filter/sort) via POST /views/<id>/queries,
  # which returns the matching page ids in view order. Current view: filter=null,
  # sorted by a hidden property ascending.
  view_id: 2f414415-10e1-809a-a581-000ccaa5ecde
  # Pinned from the build-time schema log (verified 2026-03-11).
  property_names:
    name: [Nombre de intervención]
    description: [Descripción]
    organization: [👥 Actores]
    areaTrabajo: [Area de trabajo]
    valor5Anos: [Valor ajustado a 5 años]
    viable: [¿Es viable comercialmente?]
# Simulador económico — modelo de coste de transición. Las bases viven bajo la
# página "Análisis Económico del Territorio" y deben estar compartidas con la
