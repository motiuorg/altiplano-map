# Notion database mappings. IDs are not sensitive — only NOTION_API_KEY is secret.
#
# Notion's new data model: a database page can hold several "data sources"; only a
# data source can be queried (querying the database id errors with
# "Databases with multiple data sources are not supported in this API version").
# So for each section we store BOTH the page/database id (for links) and the
# data source id (for queries) when they differ.

organizations:
  name: Actores
  database_id: 36c14415-10e1-802d-9864-e4a7d878e5e8
  data_source_id: 36c14415-10e1-806c-bf67-000b85483116
  filters:
    # Only entities whose Escala is exactly this value appear on the map/gallery.
    escala_property: Escala
    escala_value: Altiplano Estepario
  # Property names, in priority order (empty → auto-detect from the default list in
  # src/lib/records.ts). Pin them here once the schema is confirmed.
  property_names:
    name: [Name]
    description: []          # ["Descripción"] | ["Description"]
    website: []              # ["Website"] | ["Web"]
    place: [Place]
    latitude: [location_lat]
    longitude: [location_lng]
    type: []                 # ["Tipo"] — distinguishes organización vs persona
    grupoTrabajo: []          # ["Grupo de trabajo"] — checkbox or select

interventions:
  name: Intervenciones
  database_id: 2f414415-10e1-80ff-bc2f-c1581274d40f
  # View the gallery should mirror (the API cannot query a view, so its filter has to
  # be replicated here once known):
  view_id: 2f414415-10e1-809a-a581-000ccaa5ecde
  property_names:
    name: []          # ["Name"] | ["Nombre"] | ["Intervención"]
    description: []   # ["Description"] | ["Descripción"]
    organization: []  # ["Organización"] | ["Entidad"] — relation to Actores
    areaTrabajo: []   # ["Área de trabajo"] | ["Area"]
    valor5Anos: []    # ["Valor ajustado a 5 años"] — number or formula
    viable: []        # ["¿Es viable comercialmente?"] — checkbox/select