# Work areas (áreas de trabajo) and their sub-areas: the editorial content of the area pages.
#
# Written for the site on purpose: short, in plain words, and independent of the Notion "Areas de
# Trabajo" database (which is out of date). Sources: the financial strategy chapters 5.1–5.4 and
# "Paisaje Altiplano Estepario" in the vault. The numbers here are the strategy's, not live: check them
# when the strategy is revised. What IS live is everything about interventions (counts, financing,
# the cards), which comes from Notion by area and "Subarea de trabajo".
#
# Areas and sub-areas come from the interventions themselves (Notion: "Area de trabajo" and
# "Subarea de trabajo"), with their names as written there. This file only adds the words around
# them, and only where `match` fits: `match` lists names (accents, punctuation and case ignored; areas
# by prefix, sub-areas exact) of the Notion value it applies to. An area or sub-area that is not
# here still gets its page / section, just without the extra text. Sub-areas without interventions
# are not shown.

areas:
  # ------------------------------------------------------------------ 1
  - slug: tejido-territorial
    num: 1
    match: [tejido territorial, articulacion]
    kicker:
      es: "Las personas y las redes que mantienen en pie el trabajo del territorio."
      en: "The people and networks that keep the territory's work standing."
    lead:
      es: "Equipos que sostienen a las organizaciones, redes que conectan actores y comunicación que cuenta lo que ocurre. Sin este tejido, las demás áreas no se sostienen."
      en: "Teams that keep organisations running, networks that connect actors, and communication that tells what is happening. Without this fabric, the other areas cannot hold."
    dynamics:
      - title: { es: "Una agenda compartida", en: "A shared agenda" }
        text:
          es: "Los actores del territorio tienen mandatos y ritmos distintos. Una agenda común hace que lo que logra cada uno sume a escala de paisaje."
          en: "Actors in the territory have different mandates and rhythms. A common agenda makes what each achieves add up at landscape scale."
      - title: { es: "Las redes abaratan arrancar", en: "Networks make starting cheaper" }
        text:
          es: "La confianza acumulada entre actores permite acceder a programas que exigen consorcio, tener voz ante la administración y replicar lo que funciona. La Comunidad Altiplano Regenerativo lo hizo con unas 40 empresas en 2023."
          en: "Trust built up among actors opens access to programmes that require a consortium, a voice with the administration, and a way to replicate what works. The Comunidad Altiplano Regenerativo did this with about 40 businesses in 2023."
      - title: { es: "Un relato que compartimos", en: "A story we share" }
        text:
          es: "Una narrativa común hace que el territorio se reconozca a sí mismo y se entienda desde fuera. Inspira prácticas y atrae a quien aún no lo conoce."
          en: "A common narrative lets the territory recognise itself and be understood from outside. It inspires practice and draws in those who do not know it yet."
    flow:
      es: "Equipos que sostienen, redes que conectan y comunicación que difunde."
      en: "Teams that sustain, networks that connect, and communication that spreads the word."
    actors:
      - { es: "Asociación y red territorial", en: "Territorial association and network" }
      - { es: "Fundaciones", en: "Foundations" }
      - { es: "Desarrollo rural y LEADER", en: "Rural development and LEADER" }
      - { es: "Administración pública", en: "Public administration" }
    subareas:
      - match: [operaciones estructurales]
        line: { es: "Los equipos y costes fijos que mantienen en marcha a las organizaciones ancla.", en: "The teams and fixed costs that keep the anchor organisations running." }
      - match: [articulacion de redes, coordinacion de redes y gobernanza]
        line: { es: "Conecta actores con mandatos distintos y teje un relato compartido.", en: "Connects actors with different mandates and weaves a shared story." }
      - match: [comunicacion y difusion]
        line: { es: "Cuenta lo que ocurre y lo lleva a compradores, donantes y vecinos.", en: "Tells what is happening and takes it to buyers, donors and neighbours." }

  # ------------------------------------------------------------------ 2
  - slug: educacion-cultura-turismo
    num: 2
    match: [programacion educativa, educacion]
    kicker:
      es: "Que la transición se entienda, se quiera y se pueda visitar."
      en: "So the transition is understood, wanted and can be visited."
    lead:
      es: "Formación para quienes viven el paisaje, relato y fiestas que crean identidad, y una oferta turística que abre el territorio a quien viene de fuera."
      en: "Training for those who live the landscape, stories and festivals that build identity, and a tourism offer that opens the territory to visitors."
    dynamics:
      - title: { es: "Hacia adentro", en: "Inwards" }
        text:
          es: "Formación, redes de educadores y fiestas dan capacidad técnica y orgullo local. Eso sostiene el cambio cuando los incentivos escasean."
          en: "Training, educator networks and festivals build skills and local pride. That keeps change going when incentives run thin."
      - title: { es: "Hacia afuera", en: "Outwards" }
        text:
          es: "Comunicación y relato hacen legible el territorio para compradores, financiadores y visitantes que aún no lo conocen."
          en: "Communication and storytelling make the territory legible to buyers, funders and visitors who do not know it yet."
      - title: { es: "Un ciclo que se alimenta", en: "A self-feeding cycle" }
        text:
          es: "El conocimiento da base al relato, el relato da valor a la experiencia y la experiencia deja ingresos que vuelven a la formación."
          en: "Knowledge feeds the story, the story gives value to the experience, and the experience brings income back to training."
    flow:
      es: "Conocimiento, relato, experiencia y vuelta a empezar: si falla un eslabón, el ciclo se rompe."
      en: "Knowledge, story, experience, and around again: if one link fails, the cycle breaks."
    actors:
      - { es: "Educación y formación", en: "Education and training" }
      - { es: "Programación cultural y comunicación", en: "Cultural programming and communication" }
      - { es: "Turismo y recreación", en: "Tourism and recreation" }
      - { es: "Apoyo comunitario", en: "Community support" }
    subareas:
      - match: [capacidad educativa regenerativa]
        line: { es: "Formación, itinerarios y redes de educadores.", en: "Training, learning paths and educator networks." }
      - match: [comunicacion y difusion]
        line: { es: "Lleva los resultados a compradores, donantes y vecinos.", en: "Takes results to buyers, donors and neighbours." }
      - match: [eventos y actividades culturales]
        line: { es: "Convierte el paisaje en experiencia colectiva y relato compartido.", en: "Turns the landscape into a shared experience and story." }
      - match: [programacion turistica]
        line: { es: "Apoyo al turismo regenerativo y al destino AlVelAl.", en: "Support for regenerative tourism and the AlVelAl destination." }
      - match: [infraestructura turistica recreativa y comunitaria]
        line: { es: "Las condiciones físicas para visitar el territorio como destino regenerativo.", en: "The physical conditions to visit the territory as a regenerative destination." }

  # ------------------------------------------------------------------ 3
  - slug: zonas-naturales
    num: 3
    match: [zonas naturales, espacios naturales]
    kicker:
      es: "La mitad del territorio, y la que menos capital recibe."
      en: "Half the territory, and the part that receives the least capital."
    lead:
      es: "Estepa, monte y sierra sin gestión ni inversión. Aquí se decide dónde restaurar, cómo hacerlo y de qué puede vivir quien cuida el monte."
      en: "Steppe, woodland and sierra without management or investment. This is where it is decided where to restore, how, and what those who care for the land can live on."
    dynamics:
      - title: { es: "La paradoja", en: "The paradox" }
        text:
          es: "El monte da agua, biodiversidad y carbono a toda la cuenca, pero nada de eso revierte a quien lo gestiona. Sin incentivo, la gestión desaparece."
          en: "The woodland gives water, biodiversity and carbon to the whole basin, yet none of it returns to those who manage it. Without incentive, management disappears."
      - title: { es: "Primero saber dónde", en: "First, know where" }
        text:
          es: "Los estudios de corredores y suelos orientan dónde restaurar. Hoy son el hueco más claro del portafolio."
          en: "Corridor and soil studies guide where to restore. Today they are the clearest gap in the portfolio."
      - title: { es: "Que el monte se pague solo", en: "A woodland that pays its way" }
        text:
          es: "Pagos por regulación hídrica y biodiversidad, junto a usos forestales diversos, podrían hacer viable la gestión sin subvención permanente."
          en: "Payments for water regulation and biodiversity, plus diverse forest uses, could make management viable without permanent subsidy."
    flow:
      es: "Los estudios orientan la restauración y los usos productivos buscan que la gestión se sostenga a largo plazo."
      en: "Studies guide restoration, and productive uses aim to make management last in the long run."
    actors:
      - { es: "Titular de monte privado", en: "Private woodland owner" }
      - { es: "Titular de monte público", en: "Public woodland owner" }
      - { es: "Servicio técnico y agrario", en: "Technical and farm services" }
      - { es: "Investigación y universidad", en: "Research and universities" }
      - { es: "Asociación y red territorial", en: "Territorial association and network" }
    subareas:
      - match: [coordinacion de zonas naturales]
        line: { es: "El equipo y el voluntariado que coordinan el trabajo en el monte.", en: "The team and volunteers who coordinate work in the woodland." }
      - match: [estudios de uso de suelo y biodiversidad]
        line: { es: "Herramientas para decidir dónde y cómo intervenir.", en: "Tools to decide where and how to intervene." }
      - match: [restauracion de zonas naturales]
        line: { es: "Del suelo degradado al ecosistema funcional y conectado.", en: "From degraded soil to a working, connected ecosystem." }
      - match: [usos productivos de zonas forestales]
        line: { es: "Modelos de gestión forestal que no dependan solo de subvención.", en: "Forest management models that do not rely on subsidy alone." }

  # ------------------------------------------------------------------ 4
  - slug: agricultura-regenerativa
    num: 4
    match: [agricultura regenerativa]
    kicker:
      es: "Donde la transición tiene que verse en la finca."
      en: "Where the transition has to show up on the farm."
    lead:
      es: "El núcleo productivo del territorio. Aquí se genera el ingreso, se cambia el paisaje a gran escala y se demuestra que el modelo funciona."
      en: "The productive core of the territory. This is where income is made, the landscape changes at scale, and the model proves it works."
    dynamics:
      - title: { es: "La finca paga el cambio", en: "The farm pays for the change" }
        text:
          es: "Cambiar el manejo cuesta y baja el rendimiento al principio. El valor ecológico, en cambio, se reparte por todo el paisaje."
          en: "Changing management costs money and lowers yields at first. The ecological value, meanwhile, is shared across the whole landscape."
      - title: { es: "Pagar primero, cobrar despacio", en: "Pay first, get paid slowly" }
        text:
          es: "Quien comercializa adelanta la campaña y el circulante, y el dinero entra poco a poco. Transformar dentro del territorio retiene más valor, pero pide inversión."
          en: "Whoever sells has to front the season's costs and working capital, while the money comes in little by little. Processing inside the territory keeps more value, but it needs investment."
      - title: { es: "Dos flujos que se necesitan", en: "Two flows that need each other" }
        text:
          es: "Uno cambia la finca, con conocimiento, apoyo y prácticas, y vive de financiación concesional. El otro da salida a lo que produce y puede sostenerse con ingresos."
          en: "One changes the farm, through knowledge, support and practices, and lives on concessional funding. The other sells what it produces and can stand on its own income."
    flows:
      - title: { es: "Transición en finca", en: "Transition on the farm" }
        blurb:
          es: "Conocimiento, formación, apoyo material, financiación concesional, prácticas y evidencia."
          en: "Knowledge, training, material support, concessional funding, practices and evidence."
        subareas: [generacion de conocimiento agricola, formacion y asistencia tecnica, insumos y servicios, financiacion de la transicion, implementacion de practicas agricolas regenerativas, evidencia certificacion y posicionamiento]
      - title: { es: "Comercialización", en: "Marketing" }
        blurb:
          es: "Dar salida al producto: venta, transformación y negocios que sostienen la transición con ingresos."
          en: "Giving the produce a market: sales, processing and businesses that sustain the transition through income."
        subareas: [impulso de iniciativas, estudios de mercado, comercializacion de productos, infraestructura de transformacion]
        rest: true
    actors:
      - { es: "Explotación agraria", en: "Farm holding" }
      - { es: "Servicio técnico y agrario", en: "Technical and farm services" }
      - { es: "Comercialización y transformación", en: "Marketing and processing" }
      - { es: "Empresa con compromisos ecológicos", en: "Company with ecological commitments" }
      - { es: "Entidad financiera", en: "Financial institution" }
    subareas:
      - match: [generacion de conocimiento agricola, generacion de conocimiento agricola y de cadena]
        line: { es: "Finca experimental y estudios de purines, ganadería y razas autóctonas.", en: "An experimental farm and studies on slurry, livestock and local breeds." }
      - match: [formacion y asistencia tecnica, seguimiento y asistencia tecnica]
        line: { es: "Acompañamiento en finca, formación, visitas a otros territorios y un espacio físico de encuentro.", en: "On-farm support, training, visits to other territories and a physical meeting place." }
      - match: [insumos y servicios, apoyo material]
        line: { es: "Compost comunitario y banco de maquinaria que las fincas comparten.", en: "Community compost and a machinery bank that farms share." }
      - match: [financiacion de la transicion, financiacion concesional]
        line: { es: "Fondos para semillas, cubiertas, agua y biodiversidad, y proyectos como el de carbono en suelo.", en: "Funds for seed, ground cover, water and biodiversity, and projects like soil carbon." }
      - match: [implementacion de practicas agricolas regenerativas]
        line: { es: "El cambio de manejo en finca: suelo, cubiertas, biodiversidad y agua.", en: "The change of management on the farm: soil, cover, biodiversity and water." }
      - match: [evidencia certificacion y posicionamiento]
        line: { es: "Certificación regenerativa y estándares que respaldan el producto.", en: "Regenerative certification and standards that back the product." }
      - match: [impulso de iniciativas]
        line: { es: "Fondos para que nuevas iniciativas del territorio arranquen.", en: "Funds to get new initiatives in the territory off the ground." }
      - match: [estudios de mercado]
        line: { es: "Estudios económicos y de valor añadido que orientan qué y cómo vender.", en: "Economic and added-value studies that guide what to sell and how." }
      - match: [comercializacion de productos, comercializacion y transformacion de productos]
        line: { es: "Negocios que venden lo que producen las fincas: almendra, oliva y esencias.", en: "Businesses that sell what the farms produce: almonds, olives and essences." }
      - match: [infraestructura de transformacion]
        line: { es: "Activos fijos y transformación de productos dentro del territorio.", en: "Fixed assets and product processing inside the territory." }
