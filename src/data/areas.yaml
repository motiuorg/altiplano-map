# Work areas (áreas de trabajo) and their sub-areas: the editorial content of the area pages.
#
# Written for the site on purpose: short, in plain words, and independent of the Notion "Areas de
# Trabajo" database (which is out of date). Sources: the financial strategy chapters 5.1–5.4 and
# "Paisaje Altiplano Estepario" in the vault. The numbers here are the strategy's, not live: check them
# when the strategy is revised. What IS live is everything about interventions (counts, financing,
# the cards), which comes from Notion by area and "Subarea de trabajo".
#
# `match` is compared after dropping accents, punctuation and case, against the Notion select value
# (areas: by prefix, so "Articulación e impulso" and "Articulación e impulso del territorio" both fit).
# `tone` is a badge hue of the design system and must agree with src/lib/areas.ts.

areas:
  # ------------------------------------------------------------------ 1
  - slug: articulacion
    num: 1
    tone: flow
    match: [articulacion]
    name: { es: "Articulación e impulso del territorio", en: "Territorial coordination and drive" }
    short: { es: "Articulación e impulso", en: "Coordination and drive" }
    kicker:
      es: "La capa que hace que todo lo demás sume."
      en: "The layer that makes everything else add up."
    lead:
      es: "Coordinar actores, demostrar con evidencia y dar forma a iniciativas nuevas. Sin esto, cada área avanza por su lado y nada se acumula a escala de paisaje."
      en: "Coordinating actors, proving results with evidence and shaping new initiatives. Without it each area moves alone and nothing adds up at landscape scale."
    dynamics:
      - title: { es: "Una agenda compartida", en: "A shared agenda" }
        text:
          es: "Los cinco grupos de desarrollo rural trabajan cada uno en su provincia. Una agenda común multiplicaría lo que cualquiera logra solo."
          en: "The five rural development groups each work inside their own province. A common agenda would multiply what any one can do alone."
      - title: { es: "Sin evidencia no hay mercado", en: "No evidence, no market" }
        text:
          es: "Sin medición verificable no hay pagos por servicios ecosistémicos; sin certificación, la diferencia del producto no tiene respaldo."
          en: "Without verifiable measurement there are no ecosystem service payments; without certification, a product's difference has no backing."
      - title: { es: "De la idea a la iniciativa", en: "From idea to initiative" }
        text:
          es: "Incubar proyectos, con y sin modelo de negocio, hasta que puedan operar solos y recibir capital externo."
          en: "Incubating projects, with or without a business model, until they can run on their own and take outside capital."
    tension:
      es: "Es más fácil conseguir dinero para lo que se coordina que para la coordinación. Cuando el proyecto termina, la articulación también se detiene."
      en: "It is easier to raise money for what gets coordinated than for the coordination itself. When the project ends, the coordination stops too."
    tensionNote:
      es: "Pasó con la Comunidad Altiplano Regenerativo."
      en: "It happened with the Comunidad Altiplano Regenerativo."
    flow:
      es: "La coordinación da el marco, la evidencia lo hace verificable y el impulso lo convierte en iniciativas."
      en: "Coordination sets the frame, evidence makes it verifiable, and drive turns it into initiatives."
    actors:
      - { es: "Asociación y red territorial", en: "Territorial association and network" }
      - { es: "Desarrollo rural y LEADER", en: "Rural development and LEADER" }
      - { es: "Administración pública", en: "Public administration" }
      - { es: "Intermediación financiera", en: "Financial intermediaries" }
    financing:
      text:
        es: "Produce valor para todo el ecosistema y no puede cobrarlo. Solo un fondo permanente (endowment) la sostiene más allá de los ciclos de subvención."
        en: "It creates value for the whole ecosystem and cannot charge for it. Only a permanent fund (an endowment) can sustain it beyond grant cycles."
      mechanisms:
        - { es: "Filantropía flexible", en: "Flexible philanthropy" }
        - { es: "Endowment territorial", en: "Territorial endowment" }
        - { es: "Grants por convocatoria", en: "Call-based grants" }
        - { es: "Pagos por servicios ecosistémicos", en: "Payments for ecosystem services" }
        - { es: "Fondos de incubación", en: "Incubation funds" }
    subareas:
      - id: "1.1"
        match: coordinacion de redes y gobernanza
        name: { es: "Coordinación de redes y gobernanza", en: "Network coordination and governance" }
        line: { es: "Sostiene la agenda compartida entre actores con mandatos distintos.", en: "Keeps a shared agenda among actors with different mandates." }
      - id: "1.2"
        match: evidencia certificacion y posicionamiento
        name: { es: "Evidencia, certificación y posicionamiento", en: "Evidence, certification and positioning" }
        line: { es: "Estándares y medición que hacen financiable y reconocible al territorio.", en: "Standards and measurement that make the territory fundable and recognisable." }
      - id: "1.3"
        match: impulso de iniciativas
        name: { es: "Impulso de iniciativas", en: "Driving initiatives" }
        line: { es: "Incuba proyectos hasta que pueden operar y absorber capital.", en: "Incubates projects until they can operate and absorb capital." }

  # ------------------------------------------------------------------ 2
  - slug: educacion-cultura-turismo
    num: 2
    tone: purple
    match: [educacion]
    name: { es: "Educación, cultura y turismo", en: "Education, culture and tourism" }
    short: { es: "Educación, cultura y turismo", en: "Education, culture and tourism" }
    kicker:
      es: "Que la transición se entienda, se quiera y se pueda visitar."
      en: "So the transition is understood, wanted and can be visited."
    lead:
      es: "Formación para quienes viven el paisaje, relato y fiestas que crean identidad, y una oferta turística que abre el territorio a quien viene de fuera."
      en: "Training for those who live the landscape, stories and festivals that build identity, and a tourism offer that opens the territory to visitors."
    dynamics:
      - title: { es: "Hacia adentro", en: "Inwards" }
        text:
          es: "Formación, redes de educadores y fiestas dan capacidad técnica y orgullo local. Eso sostiene el cambio cuando los incentivos escasean."
          en: "Training, educator networks and festivals build skills and local pride. That keeps change going when incentives run thin."
      - title: { es: "Hacia afuera", en: "Outwards" }
        text:
          es: "Comunicación y relato hacen legible el territorio para compradores, financiadores y visitantes que aún no lo conocen."
          en: "Communication and storytelling make the territory legible to buyers, funders and visitors who do not know it yet."
      - title: { es: "Un ciclo que se alimenta", en: "A self-feeding cycle" }
        text:
          es: "El conocimiento da base al relato, el relato da valor a la experiencia y la experiencia deja ingresos que vuelven a la formación."
          en: "Knowledge feeds the story, the story gives value to the experience, and the experience brings income back to training."
    tension:
      es: "El turismo es el eslabón con más potencial de retorno y el menos desarrollado. Hoy el territorio no tiene dónde alojar a quien ya sabe que existe."
      en: "Tourism is the link with the most return potential and the least development. Today the territory has nowhere to host those who already know it exists."
    tensionNote: null
    flow:
      es: "Conocimiento, relato, experiencia y vuelta a empezar: si falla un eslabón, el ciclo se rompe."
      en: "Knowledge, story, experience, and around again: if one link fails, the cycle breaks."
    actors:
      - { es: "Educación y formación", en: "Education and training" }
      - { es: "Programación cultural y comunicación", en: "Cultural programming and communication" }
      - { es: "Turismo y recreación", en: "Tourism and recreation" }
      - { es: "Apoyo comunitario", en: "Community support" }
    financing:
      text:
        es: "Educación y cultura son bienes colectivos y viven de fondos territoriales y grants. El turismo es la parte que puede sostenerse con ingresos propios y banca."
        en: "Education and culture are shared goods and live on territorial funds and grants. Tourism is the part that can stand on its own income and bank finance."
      mechanisms:
        - { es: "Fondos territoriales y locales", en: "Territorial and local funds" }
        - { es: "Grants por convocatoria", en: "Call-based grants" }
        - { es: "Filantropía flexible", en: "Flexible philanthropy" }
        - { es: "Capital público y de desarrollo", en: "Public and development capital" }
        - { es: "Banca y deuda privada", en: "Private banking and debt" }
    subareas:
      - id: "2.1"
        match: capacidad educativa regenerativa
        name: { es: "Capacidad educativa regenerativa", en: "Regenerative education capacity" }
        line: { es: "Formación, itinerarios y redes de educadores.", en: "Training, learning paths and educator networks." }
      - id: "2.2"
        match: comunicacion y difusion
        name: { es: "Comunicación y difusión", en: "Communication and outreach" }
        line: { es: "Lleva los resultados a compradores, donantes y vecinos.", en: "Takes results to buyers, donors and neighbours." }
      - id: "2.3"
        match: eventos y actividades culturales
        name: { es: "Eventos y actividades culturales", en: "Cultural events and activities" }
        line: { es: "Convierte el paisaje en experiencia colectiva y relato compartido.", en: "Turns the landscape into a shared experience and story." }
      - id: "2.4"
        match: infraestructura turistica recreativa y comunitaria
        name: { es: "Infraestructura turística, recreativa y comunitaria", en: "Tourist, recreational and community infrastructure" }
        line: { es: "Las condiciones físicas para visitar el territorio como destino regenerativo.", en: "The physical conditions to visit the territory as a regenerative destination." }

  # ------------------------------------------------------------------ 3
  - slug: zonas-naturales
    num: 3
    tone: neural
    match: [zonas naturales, espacios naturales]
    name: { es: "Zonas naturales", en: "Natural areas" }
    short: { es: "Zonas naturales", en: "Natural areas" }
    kicker:
      es: "La mitad del territorio, y la que menos capital recibe."
      en: "Half the territory, and the part that receives the least capital."
    lead:
      es: "Estepa, monte y sierra sin gestión ni inversión. Aquí se decide dónde restaurar, cómo hacerlo y de qué puede vivir quien cuida el monte."
      en: "Steppe, woodland and sierra without management or investment. This is where it is decided where to restore, how, and what those who care for the land can live on."
    dynamics:
      - title: { es: "La paradoja", en: "The paradox" }
        text:
          es: "El monte da agua, biodiversidad y carbono a toda la cuenca, pero nada de eso revierte a quien lo gestiona. Sin incentivo, la gestión desaparece."
          en: "The woodland gives water, biodiversity and carbon to the whole basin, yet none of it returns to those who manage it. Without incentive, management disappears."
      - title: { es: "Primero saber dónde", en: "First, know where" }
        text:
          es: "Los estudios de corredores y suelos orientan dónde restaurar. Hoy son el hueco más claro del portafolio."
          en: "Corridor and soil studies guide where to restore. Today they are the clearest gap in the portfolio."
      - title: { es: "Dinero público en suelo público", en: "Public money on public land" }
        text:
          es: "En montes de titularidad pública solo puede entrar financiación pública, justo donde más suelo hay, y es de céntimos por hectárea."
          en: "On publicly owned land only public funding can enter, right where most land is, and it amounts to cents per hectare."
      - title: { es: "Que el monte se pague solo", en: "A woodland that pays its way" }
        text:
          es: "Pagos por regulación hídrica y biodiversidad, junto a usos forestales diversos, podrían hacer viable la gestión sin subvención permanente."
          en: "Payments for water regulation and biodiversity, plus diverse forest uses, could make management viable without permanent subsidy."
    tension:
      es: "Hacen falta dos saltos a la vez: escalar la restauración de 300 a 8.000 hectáreas, y diseñar los pagos que hoy no existen para el clima semiárido."
      en: "Two jumps are needed at once: scaling restoration from 300 to 8,000 hectares, and designing the payments that do not yet exist for a semi-arid climate."
    tensionNote: null
    flow:
      es: "Los estudios orientan la restauración y los usos productivos buscan que la gestión se sostenga a largo plazo."
      en: "Studies guide restoration, and productive uses aim to make management last in the long run."
    actors:
      - { es: "Titular de monte privado", en: "Private woodland owner" }
      - { es: "Titular de monte público", en: "Public woodland owner" }
      - { es: "Servicio técnico y agrario", en: "Technical and farm services" }
      - { es: "Investigación y universidad", en: "Research and universities" }
      - { es: "Asociación y red territorial", en: "Territorial association and network" }
    financing:
      text:
        es: "Hoy todo es concesional: ayudas PAC, fondos locales, grants europeos y filantropía. A largo plazo, los pagos por servicios ecosistémicos son la salida."
        en: "Today it is all concessional: CAP aid, local funds, European grants and philanthropy. In the long run, payments for ecosystem services are the way out."
      mechanisms:
        - { es: "Ayudas a titulares de suelo", en: "Support for landowners" }
        - { es: "Fondos territoriales y locales", en: "Territorial and local funds" }
        - { es: "Grants por convocatoria", en: "Call-based grants" }
        - { es: "Filantropía flexible", en: "Flexible philanthropy" }
        - { es: "Pagos por servicios ecosistémicos", en: "Payments for ecosystem services" }
    subareas:
      - id: "3.1"
        match: estudios de uso de suelo y biodiversidad
        name: { es: "Estudios de uso de suelo y biodiversidad", en: "Land use and biodiversity studies" }
        line: { es: "Herramientas para decidir dónde y cómo intervenir.", en: "Tools to decide where and how to intervene." }
      - id: "3.2"
        match: restauracion de zonas naturales
        name: { es: "Restauración de zonas naturales", en: "Restoration of natural areas" }
        line: { es: "Del suelo degradado al ecosistema funcional y conectado.", en: "From degraded soil to a working, connected ecosystem." }
      - id: "3.3"
        match: usos productivos de zonas forestales
        name: { es: "Usos productivos de zonas forestales", en: "Productive uses of forest areas" }
        line: { es: "Modelos de gestión forestal que no dependan solo de subvención.", en: "Forest management models that do not rely on subsidy alone." }

  # ------------------------------------------------------------------ 4
  - slug: agricultura-regenerativa
    num: 4
    tone: tissue
    match: [agricultura regenerativa]
    name: { es: "Agricultura regenerativa", en: "Regenerative agriculture" }
    short: { es: "Agricultura regenerativa", en: "Regenerative agriculture" }
    kicker:
      es: "Donde la transición tiene que verse en la finca."
      en: "Where the transition has to show up on the farm."
    lead:
      es: "El núcleo productivo del territorio. Aquí se genera el ingreso, se cambia el paisaje a gran escala y se demuestra que el modelo funciona."
      en: "The productive core of the territory. This is where income is made, the landscape changes at scale, and the model proves it works."
    dynamics:
      - title: { es: "La finca paga el cambio", en: "The farm pays for the change" }
        text:
          es: "Cambiar el manejo cuesta y baja el rendimiento al principio. El valor ecológico, en cambio, se reparte por todo el paisaje."
          en: "Changing management costs money and lowers yields at first. The ecological value, meanwhile, is shared across the whole landscape."
      - title: { es: "Una cadena de cuatro eslabones", en: "A chain of four links" }
        text:
          es: "Sin conocimiento no hay asistencia; sin asistencia, la finca no cambia; sin cambio no hay producto distinto; sin venta, no hay quien lo pague."
          en: "No knowledge, no support; no support, no change on the farm; no change, no different product; no sale, nobody to pay for it."
      - title: { es: "La brecha de capital", en: "The capital gap" }
        text:
          es: "Falta mucho entre lo que costaría la transición y los fondos que hoy llegan. El resto sale de los propios agricultores."
          en: "A lot is missing between what the transition would cost and the funds that arrive today. The rest comes from the farmers themselves."
      - title: { es: "Los primeros años", en: "The first years" }
        text:
          es: "Los negocios son demasiado jóvenes para la banca y demasiado pequeños para el capital de impacto. Ahí entra la incubación."
          en: "Businesses are too young for banks and too small for impact capital. That is where incubation comes in."
    tension:
      es: "Sin hectáreas certificadas, productos en lineales y agricultores con ingresos estables, las demás áreas producen resultados que nadie puede contar."
      en: "Without certified hectares, products on shelves and farmers with steady income, the other areas produce results nobody can count."
    tensionNote: null
    flow:
      es: "Del conocimiento a la venta: cada eslabón es condición del siguiente."
      en: "From knowledge to sale: each link is a condition for the next."
    actors:
      - { es: "Explotación agraria", en: "Farm holding" }
      - { es: "Servicio técnico y agrario", en: "Technical and farm services" }
      - { es: "Comercialización y transformación", en: "Marketing and processing" }
      - { es: "Empresa con compromisos ecológicos", en: "Company with ecological commitments" }
      - { es: "Entidad financiera", en: "Financial institution" }
    financing:
      text:
        es: "Es el portafolio más amplio y complejo. El conocimiento y la asistencia viven de grants; la finca, de ayudas y deuda adaptada; la venta, de capital de cadena y banca."
        en: "The largest and most complex portfolio. Knowledge and support live on grants; the farm on aid and adapted debt; sales on value-chain capital and banks."
      mechanisms:
        - { es: "Fondos de transición", en: "Transition funds" }
        - { es: "Deuda bancaria adaptada", en: "Adapted bank debt" }
        - { es: "Ayudas a titulares de explotación", en: "Support for farm holders" }
        - { es: "Capital estratégico de cadena", en: "Value-chain strategic capital" }
        - { es: "Equity e inversión de impacto", en: "Impact equity and investment" }
        - { es: "Pagos por servicios ecosistémicos", en: "Payments for ecosystem services" }
    subareas:
      - id: "4.1"
        match: generacion de conocimiento agricola y de cadena
        name: { es: "Generación de conocimiento agrícola y de cadena", en: "Agricultural and value-chain knowledge" }
        line: { es: "Evidencia técnica y de mercado que reduce la incertidumbre.", en: "Technical and market evidence that reduces uncertainty." }
      - id: "4.2"
        match: seguimiento y asistencia tecnica
        name: { es: "Seguimiento y asistencia técnica", en: "Monitoring and technical support" }
        line: { es: "Acompañamiento en finca, maquinaria compartida y compost.", en: "On-farm support, shared machinery and compost." }
      - id: "4.3"
        match: implementacion de practicas agricolas regenerativas
        name: { es: "Implementación de prácticas agrícolas regenerativas", en: "Implementing regenerative farming practices" }
        line: { es: "El cambio de manejo en finca: suelo, cubiertas, biodiversidad y agua.", en: "The change of management on the farm: soil, cover, biodiversity and water." }
      - id: "4.4"
        match: comercializacion y transformacion de productos
        name: { es: "Comercialización y transformación de productos", en: "Marketing and processing of products" }
        line: { es: "Negocios que dan salida y valor añadido a lo que producen las fincas.", en: "Businesses that give farm produce a market and added value." }
