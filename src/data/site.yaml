# Site identity for the shared design-system shell (Layout, Nav, Footer).
# Strings may be plain or { es, en } maps.
name: Altiplano Estepario
url: https://motiuorg.github.io
description:
  es: Mapa de organizaciones e intervenciones del Altiplano Estepario
  en: Map of the organizations and interventions of the Altiplano Estepario
favicon: /favicon.svg
titleTemplate: "{title}"
locales:
  default: es
  label: { es: Idioma, en: Language }
  list:
    - { code: es, label: ES }
    - { code: en, label: EN }

# --- app-specific (read by the map, not by the shell)
map:
  # Default view when there are no geolocated markers
  center: [41.15, -1.35]
  zoom: 8.5

# Marker / badge semantics
groups:
  groupoTrabajo:
    label: Grupo de trabajo
    color: "var(--pillar-flow-3)" # #FF7A00 — orange, the active/primary accent
  resto:
    label: Resto de organizaciones
    color: "var(--data-support)" # supporting blue, the design system's data colour