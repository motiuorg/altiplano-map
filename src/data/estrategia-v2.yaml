# Estrategia financiera v2: sources, mechanisms and work areas, connected (/estrategia-v2/).
#
# Hand-authored, like estrategia.yaml. The nodes and texts come from the World Café cards (Notion, "Tarjetas
# World Café", 18 nov 2026): 5 áreas, 21 sub-áreas, 10 fuentes, 5 mecanismos. Texts are condensed, not copied,
# and the cards' "pregunta para la mesa" is left out on purpose (it belongs to the workshop, not the public site).
#
# Links show that money can move between two parts, not how much. `kind`:
#   estructura  money that passes through a mechanism (solid ribbon)
#   directo     money that reaches a sub-area or the base with no mechanism in between (dashed ribbon)
#   retornos    returns from the investment portfolio back to the base (solid, labelled)
# `to` is a node id (a mechanism or sub-area) or `tejido` (the base band, Tejido territorial).
#
# Where the links come from:
#   source → mechanism      each mechanism card's "quién participaría"
#   source → sub-area       direct, and only where the process adds something there: strategic support to the
#                           source itself (fondos territoriales, e.g. the GDRs) or a source with no mechanism
#                           (convocatorias → conocimiento agrícola, restauración, desarrollo de marca), or the payments
#                           that reach land holders directly (ayudas a titulares → restauración, transición). The cards'
#                           "vías que encajan" list many more, but those reach the sub-areas through a mechanism.
#   mechanism → sub-area    a first reading, NOT in the cards: a starting point to discuss
#   mechanism → tejido      only the mechanisms that can fund the base itself: fondo canalizador, portafolio de inversión
#                           territorial (its returns) and fondo mancomunal. No source reaches the base directly.
# `gap: true` marks a sub-area with no source mapped in the cards: a mapping gap, not an absence of need.

intro:
  es: "Cada tipo de dinero llega al territorio con sus propias condiciones. Este mapa conecta diez fuentes de financiación, cinco mecanismos y las sub-áreas de las áreas de trabajo del Altiplano Estepario, con el tejido territorial como base. Elige un área para ver solo lo que la sostiene."
  en: "Every kind of money reaches the landscape on its own terms. This map connects ten funding sources, five mechanisms and the sub-areas of the Altiplano Estepario's work areas, with the landscape fabric as its base. Choose an area to see only what supports it."

sources:
  - id: ayu
    label: { es: "Ayudas a titulares (PAC y similares)", en: "Payments to land holders (CAP and similar)" }
    short: { es: "Ayudas a titulares", en: "Land-holder payments" }
    text:
      es: "Pagos que llegan directamente a quien posee o trabaja la tierra, como la PAC y las medidas agroambientales. No se piden por convocatoria de proyecto y dependen de la política agraria."
      en: "Payments that go straight to whoever owns or works the land, such as the CAP and agri-environment measures. They are not applied for per project and depend on agricultural policy."
    how: { es: "Automático, si se cumplen los requisitos de la ayuda.", en: "Automatic, if the payment's requirements are met." }
    funds: { es: "Parte del cambio de manejo: los ecorregímenes cubren algunas prácticas regenerativas.", en: "Part of the change of management: eco-schemes cover some regenerative practices." }
    asks: { es: "Cumplir los requisitos de cada ayuda.", en: "Meeting each payment's requirements." }
    challenges:
      es: "En algunos casos la PAC penaliza las prácticas regenerativas, porque no encajan con lo que espera ver."
      en: "In some cases the CAP penalises regenerative practices, because they do not fit what it expects to see."
  - id: conv
    label: { es: "Convocatorias nacionales y europeas", en: "National and European calls" }
    text:
      es: "Convocatorias competitivas, como Horizon, LIFE, PRIMA y los Grupos Operativos. Financian proyectos concretos, normalmente en consorcio."
      en: "Competitive calls such as Horizon, LIFE, PRIMA and Operational Groups. They fund specific projects, usually in a consortium."
    how: { es: "Competitiva: se presenta una propuesta.", en: "Competitive: a proposal is submitted." }
    funds: { es: "Acción con entregables verificables.", en: "Action with verifiable deliverables." }
    asks: { es: "Entregables verificables; rara vez cubre la estructura entre convocatorias.", en: "Verifiable deliverables; it rarely covers the structure between calls." }
    challenges:
      es: "Es competitiva y pide capacidad para preparar propuestas y trabajar en consorcio. Financia acción con entregables, rara vez la estructura entre una convocatoria y la siguiente."
      en: "It is competitive and takes the capacity to prepare proposals and work in a consortium. It funds action with deliverables, rarely the structure between one call and the next."
  - id: terr
    label: { es: "Fondos territoriales y regionales", en: "Territorial and regional funds" }
    text:
      es: "Fondos de administraciones locales y regionales, como LEADER. El trabajo va en dos sentidos: ayudar a definir su estrategia y sus criterios para que lleguen mejor al territorio, y ver después qué proyectos pueden aplicar o qué mecanismos se pueden crear juntos, como pagos por resultados."
      en: "Funds from local and regional administrations, such as LEADER. The work runs both ways: helping shape their strategy and criteria so they reach the landscape better, then seeing which projects can apply or which mechanisms can be built together, such as payments for results."
    how: { es: "Por estrategia y por convocatoria.", en: "Through strategy and through calls." }
    challenges:
      es: "Sus criterios no siempre se ajustan a lo que el territorio necesita, y llegar mejor a ellos pide primero influir en cómo se definen."
      en: "Their criteria do not always fit what the landscape needs, and reaching them better means first influencing how they are defined."
  - id: fil
    label: { es: "Filantropía", en: "Philanthropy" }
    text:
      es: "Fundaciones y programas de largo plazo. Es el capital más flexible."
      en: "Foundations and long-term programmes. It is the most flexible capital."
    how: { es: "Por relación o por convocatoria abierta.", en: "Through relationships or open calls." }
    funds: { es: "Coordinación, seguimiento y los primeros pasos de los fondos del territorio.", en: "Coordination, monitoring and the first steps of the landscape's funds." }
    asks: { es: "Confianza y un propósito compartido; en las convocatorias, además, propuesta y resultados.", en: "Trust and a shared purpose; in calls, also a proposal and results." }
    challenges:
      es: "Suele financiar un proyecto o una etapa. Que una fundación se quede a largo plazo depende de la confianza y de que vea resultados."
      en: "It usually funds a project or a stage. Getting a foundation to stay for the long term depends on trust and on seeing results."
  - id: des
    label: { es: "Capital público de desarrollo (BEI, ICO)", en: "Public development capital (EIB, ICO)" }
    short: { es: "Capital público de desarrollo", en: "Public development capital" }
    text:
      es: "Bancos y agencias públicas cuyo retorno es de mandato, no financiero."
      en: "Public banks and agencies whose return is their mandate, not profit."
    how: { es: "Por acuerdo, a través de un mecanismo (deuda adaptada, portafolio de inversión) más que proyecto a proyecto.", en: "By agreement, through a mechanism (adapted debt, investment portfolio) rather than project by project." }
    funds: { es: "Puede asumir primeras pérdidas o aliviar el capital de la banca para que entre crédito privado en condiciones que el mercado no daría solo.", en: "It can take first losses or relieve banks' capital so private credit enters on terms the market would not give alone." }
    challenges:
      es: "Rara vez llega proyecto a proyecto: pide un mecanismo y un paquete de proyectos que demuestre lo que aporta."
      en: "It rarely arrives project by project: it asks for a mechanism and a package of projects that shows what it contributes."
  - id: ban
    label: { es: "Banca y cajas rurales", en: "Banks and rural savings banks" }
    text:
      es: "Cajas rurales y banca ética que prestan con criterios de solvencia y garantía. Cajamar y Caja Rural de Granada ya ofrecen líneas ecológicas de hasta 15 años."
      en: "Rural savings banks and ethical banks lending on solvency and collateral. Cajamar and Caja Rural de Granada already offer green credit lines of up to 15 years."
    how: { es: "Solicitud de crédito a una caja rural o a la banca ética.", en: "A credit application to a rural savings bank or an ethical bank." }
    funds: { es: "Proyectos con ingresos capaces de devolver un préstamo.", en: "Projects with income able to repay a loan." }
    asks: { es: "Solvencia y garantía.", en: "Solvency and collateral." }
    challenges:
      es: "Puede financiar muchos tipos de iniciativa, pero pide demostrar que el préstamo se puede devolver y aportar respaldo. A quien no lo tiene, o cuyo caso no se parece a lo que la banca suele analizar, le cuesta entrar."
      en: "It can finance many kinds of initiative, but it asks borrowers to show they can repay and to put up backing. Those who cannot, or whose case looks unlike what banks usually assess, find it hard to get in."
  - id: imp
    label: { es: "Inversión de impacto", en: "Impact investment" }
    text:
      es: "Fondos con mandato de impacto que aceptan retornos moderados y horizontes largos a cambio de impacto demostrable."
      en: "Funds with an impact mandate that accept moderate returns and long horizons in exchange for demonstrable impact."
    how: { es: "Presentando una empresa o un portafolio de iniciativas a un fondo que evalúe su negocio y su impacto.", en: "Presenting a business or a portfolio of initiatives to a fund that assesses its business and impact." }
    funds: { es: "Empresas con modelo de negocio que quieren crecer.", en: "Businesses with a business model that want to grow." }
    asks: { es: "Facturación mínima y medición.", en: "Minimum turnover and measurement." }
    challenges:
      es: "Pide facturación mínima y medir el impacto con regularidad, algo que muchas iniciativas del territorio aún no pueden demostrar."
      en: "It asks for minimum turnover and regular impact measurement, which many of the landscape's initiatives cannot yet show."
  - id: cad
    label: { es: "Capital estratégico de cadena", en: "Strategic value-chain capital" }
    text:
      es: "Compradores y distribuidoras que invierten en sus proveedores porque les resuelve algo propio: suministro, compromisos de clima o marca."
      en: "Buyers and distributors who invest in their suppliers because it solves something of their own: supply, climate commitments or brand."
    how: { es: "Por relación comercial: el comprador invierte en quien ya le suministra o podría suministrarle.", en: "Through a commercial relationship: the buyer invests in someone who already supplies it or could." }
    funds: { es: "La transición de fincas y las cadenas de suministro.", en: "Farm transition and supply chains." }
    challenges:
      es: "Solo invierte cuando le resuelve algo propio, como el suministro, un compromiso de clima o la marca. Depende de que haya compradores a los que les interese que el territorio aguante."
      en: "It only invests when it solves something of its own, such as supply, a climate commitment or brand. It depends on there being buyers who care that the landscape holds."
  - id: seg
    label: { es: "Seguros y suministradoras", en: "Insurers and utilities" }
    text:
      es: "Empresas que ganan si el territorio aguanta: aseguradoras que pagan menos por sequía, incendio o erosión; compañías de agua, regadío, embalses o hidroeléctrica que dependen de que la tierra retenga agua y suelo."
      en: "Companies that gain if the landscape holds: insurers that pay out less for drought, fire or erosion; water, irrigation, reservoir or hydropower companies that depend on land retaining water and soil."
    how: { es: "Por acuerdo: pagan por prácticas que reducen un riesgo verificable.", en: "By agreement: they pay for practices that reduce a verifiable risk." }
    funds: { es: "Prácticas que reducen un riesgo de forma verificable, sin comprar nada más al territorio.", en: "Practices that verifiably reduce a risk, without buying anything else from the landscape." }
    challenges:
      es: "El riesgo reducido tiene que ser lo bastante claro y verificable para que alguien pague por él. Hoy cuesta medirlo y atribuirlo a una práctica."
      en: "The reduced risk has to be clear and verifiable enough for someone to pay for it. Today it is hard to measure and attribute to a practice."
  - id: prop
    label: { es: "Aportaciones del propio territorio", en: "Contributions from the landscape itself" }
    short: { es: "Aportaciones del territorio", en: "Landscape's own contributions" }
    text:
      es: "Dinero que ponen las propias empresas y entidades del territorio, por ejemplo mediante cuotas o aportaciones voluntarias. Es la parte que pone el territorio, junto a la de quienes financian desde fuera."
      en: "Money put in by the landscape's own businesses and organisations, for example through fees or voluntary contributions. It is the landscape's share, alongside that of outside funders."
    how: { es: "Por compromiso entre quienes participan.", en: "By commitment among those taking part." }
    funds: { es: "Lo que beneficia a todas las partes que aportan, como servicios compartidos o un fondo común.", en: "What benefits every contributing party, such as shared services or a common fund." }
    asks: { es: "Reglas claras sobre quién aporta, cuánto y quién decide.", en: "Clear rules on who contributes, how much and who decides." }

    challenges:
      es: "Cuesta arrancar sin que alguien ponga primero y sin acordar quién decide, y cada parte que aporta necesita ver algo a cambio."
      en: "It is hard to start without someone putting in first and without agreeing who decides, and each contributing party needs to see something in return."
mechanisms:
  - id: fc
    label: { es: "Fondo canalizador", en: "Pass-through fund" }
    status: { es: "En diseño", en: "In design" }
    text:
      es: "Un fondo común que recibe dinero filantrópico y público y lo pasa entero a proyectos y al proceso, con criterios y seguimiento claros."
      en: "A common fund that receives philanthropic and public money and passes all of it on to projects and the process, with clear criteria and monitoring."
    # `how` is the "Un escenario" column: a list of numbered steps (a plain string is also accepted and shown as a paragraph).
    how:
      es:
        - "El grupo presenta a los financiadores una narrativa y unas reglas de gobernanza compartidas: quién decide, cómo se reparte y cómo se rinden cuentas."
        - "Fundaciones, programas públicos y otros financiadores aportan a un mismo fondo, con una sola contabilidad. Por ejemplo, 200.000 € de una fundación y una línea regional."
        - "Una mesa abierta reparte lo recibido con criterios públicos. En un mismo ciclo puede ir a restaurar 40 hectáreas de monte, acompañar a doce fincas en su transición, pagar estudios y certificación, o sostener la coordinación del proceso."
        - "Como una de las opciones, parte del fondo se reparte por convocatoria abierta, para que otras organizaciones presenten sus propias ideas."
        - "Cada seis meses se publica qué entró, qué se repartió y qué cambió en cada sitio."
      en:
        - "The group presents funders with a shared narrative and governance rules: who decides, how money is allocated and how accounts are given."
        - "Foundations, public programmes and other funders contribute to a single fund, with one set of accounts. For example, €200,000 from a foundation and a regional line."
        - "An open table allocates what is received on public criteria. In a single cycle it can go to restoring 40 hectares of woodland, supporting twelve farms in their transition, paying for studies and certification, or sustaining the coordination of the process."
        - "As one of the options, part of the fund is allocated through an open call, so that other organisations can put forward their own ideas."
        - "Every six months a report is published on what came in, what was allocated and what changed in each place."
    evolution:
      es: "Empieza como canal: pasa el dinero y no guarda capital. A largo plazo podría convertirse en un fondo perpetuo (endowment) que conserve el capital y financie con sus rendimientos."
      en: "It starts as a channel: it passes money on and holds no capital. In the long term it could become a perpetual fund (endowment) that keeps the capital and funds from its returns."
  - id: pes
    label: { es: "Pagos por servicios al territorio", en: "Payments for landscape services" }
    status: { es: "Idea", en: "Idea" }
    idea: true
    text:
      es: "Quien se beneficia de un resultado verificable paga a quien lo logra, sin necesidad de comprarle nada más. El resultado puede ser ecológico (agua, carbono, biodiversidad) o de otro tipo, como cultural."
      en: "Whoever benefits from a verifiable result pays whoever achieves it, without having to buy anything else from them. The result can be ecological (water, carbon, biodiversity) or of another kind, such as cultural."
    how:
      es:
        - "Se define qué prácticas benefician al territorio y qué resultados ofrece cada una. Por ejemplo, mantener cobertura vegetal en el almendro reduce la erosión, retiene agua y baja el riesgo de incendio; cerrar un corredor de biodiversidad conecta hábitats para la fauna."
        - "Se identifica quién se beneficia de cada resultado. Una misma práctica suele tener varios beneficiarios: menos erosión le importa a quien gestiona un embalse, el agua retenida a una compañía de agua, el menor riesgo de incendio a una aseguradora o administración pública, y la práctica en sí a un gran comprador corporativo de la cadena de valor, que asegura así su suministro y cumple sus compromisos de clima."
        - "Los pagadores aportan juntos a un solo pago por esa práctica, cada uno por el beneficio que recibe, en lugar de negociar por separado con cada finca."
        - "Una tercera parte neutra verifica cada año con el mismo método."
        - "Quien adopta la práctica cobra, por ejemplo una cantidad por hectárea. El pago puede ligarse a la práctica o al resultado que da, según lo que se pueda verificar, sin necesidad de comprar nada más al territorio."
      en:
        - "It defines which practices benefit the landscape and what results each one delivers. For example, keeping a ground cover in almond groves reduces erosion, retains water and lowers fire risk; closing a biodiversity corridor connects habitats for wildlife."
        - "It identifies who benefits from each result. One practice often has several beneficiaries: less erosion matters to whoever manages a reservoir, retained water to a water company, lower fire risk to an insurer or public administration, and the practice itself to a large corporate buyer in the value chain, which secures its supply and meets its climate commitments."
        - "Payers contribute together to a single payment for that practice, each for the benefit it receives, instead of negotiating separately with each farm."
        - "A neutral third party verifies every year with the same method."
        - "Whoever adopts the practice is paid, for example an amount per hectare. The payment can be tied to the practice or to the result it delivers, depending on what can be verified, without having to buy anything else from the landscape."
  - id: dba
    label: { es: "Deuda bancaria adaptada", en: "Adapted bank debt" }
    status: { es: "En discusión", en: "In discussion" }
    text:
      es: "Un mecanismo de crédito creado con los bancos y el Banco Europeo de Inversión (BEI) con plazos más largos y garantías más flexibles para proyectos que cumplen criterios verificados, como fincas con prácticas regenerativas o empresas que compran a esas fincas."
      en: "A credit mechanism built with banks and the European Investment Bank (EIB) with longer terms and more flexible guarantees for projects that meet verified criteria, such as farms with regenerative practices or businesses that buy from those farms."
    how:
      es:
        - "Las cajas rurales y el BEI acuerdan qué proyectos acceden y con qué criterio: por ejemplo, certificación regenerativa para una finca, o compras a fincas certificadas para una comercializadora."
        - "La línea ofrece condiciones que el crédito habitual no da, como 15 años de plazo, dos de carencia y garantías más flexibles, con la certificación como respaldo."
        - "El BEI asume parte del riesgo y alivia el capital de las cajas, para que prestar así no les cueste más."
        - "Sirve a cualquier proyecto con ingresos que puedan devolver el préstamo: la transición de una finca, un banco de maquinaria compartido, el circulante de una comercializadora o una planta de transformación."
        - "El criterio se revisa cada año, por ejemplo al renovar la certificación."
      en:
        - "Rural savings banks and the EIB agree which projects qualify and on what criterion: for example, regenerative certification for a farm, or purchases from certified farms for a marketer."
        - "The line offers terms that usual credit does not, such as 15 years to repay, two of grace and more flexible guarantees, with the certification as backing."
        - "The EIB takes part of the risk and relieves the banks' capital, so lending this way costs them no more."
        - "It serves any project with income able to repay the loan: a farm's transition, a shared machinery bank, a marketer's working capital or a processing plant."
        - "The criterion is reviewed every year, for example when the certification is renewed."
  - id: fit
    label: { es: "Portafolio de inversión territorial", en: "Landscape investment portfolio" }
    status: { es: "En diseño", en: "In design" }
    text:
      es: "Un portafolio de inversiones en negocios y activos del territorio que pueden devolver el dinero con el tiempo: suelo productivo, comercialización, transformación y otras iniciativas con modelo de negocio. Se construiría por fases, y parte de sus retornos podría sostener el trabajo que prepara esas iniciativas."
      en: "A portfolio of investments in the landscape's businesses and assets that can repay over time: productive land, marketing, processing and other initiatives with a business model. It would be built in phases, and part of its returns could sustain the work that prepares those initiatives."
    how:
      es:
        - "Se diseña primero: qué iniciativas entran, con qué criterios y qué retorno se espera de cada una."
        - "Caben iniciativas de varias áreas, como una planta de transformación de almendra, una comercializadora compartida, suelo productivo o una finca de ganadería regenerativa."
        - "Se presenta el portafolio a posibles financiadores y se habla con cada uno de qué papel puede tener y en qué condiciones: capital público de desarrollo, inversores de impacto, compradores de la cadena."
        - "El capital entra por fases, y cada financiador firma su propio acuerdo. Por ejemplo, el capital público de desarrollo cubre las primeras pérdidas, los inversores de impacto aportan la parte principal y un comprador de la cadena entra a cambio de suministro."
        - "Una parte de los retornos vuelve al territorio y paga el trabajo que prepara las siguientes iniciativas."
      en:
        - "It is designed first: which initiatives enter, on what criteria and what return is expected from each."
        - "Initiatives from several areas fit, such as an almond processing plant, a shared marketing company, productive land or a regenerative livestock farm."
        - "The portfolio is presented to potential funders, and each is asked what role it could play and on what terms: public development capital, impact investors, value-chain buyers."
        - "Capital comes in phases, and each funder signs its own agreement. For example, public development capital covers first losses, impact investors put in the main share and a value-chain buyer joins in exchange for supply."
        - "Part of the returns goes back to the landscape and pays for the work that prepares the next initiatives."
    evolution:
      es: "Empieza como un portafolio, con cada inversión en su propio acuerdo. Con el tiempo puede evolucionar a un fondo de inversión territorial."
      en: "It starts as a portfolio, with each investment under its own agreement. Over time it can evolve into a landscape investment fund."
  - id: fm
    label: { es: "Fondo mancomunal", en: "Shared community fund" }
    status: { es: "Idea", en: "Idea" }
    idea: true
    text:
      es: "Un fondo en el que quienes participan ponen dinero en común y deciden juntos cómo usarlo. También sirve cuando quienes se benefician de una mejora común, como el agua o el monte, aportan juntos para financiarla."
      en: "A fund where participants pool money and decide together how to use it. It also works when those who benefit from a shared improvement, such as water or the forest, contribute together to fund it."
    how:
      es:
        - "Antes de poner dinero, unas ocho empresas y entidades se reúnen para encontrar objetivos comunes."
        - "Acuerdan unas reglas claras: quién aporta, cuánto según su tamaño y quién decide, por ejemplo un voto por aportante."
        - "Cada una hace su aportación anual, y el fondo reúne, por ejemplo, 30.000 € el primer año."
        - "Deciden juntas en qué usarlo. Puede ser un bien compartido (maquinaria, investigación), el mantenimiento del monte, formación de personal o una promoción turística conjunta."
        - "Otras fuentes pueden sumarse al ver que el territorio ya pone dinero."
      en:
        - "Before any money goes in, around eight businesses and organisations meet to find common goals."
        - "They agree clear rules: who contributes, how much according to size and who decides, for example one vote per contributor."
        - "Each makes its annual contribution, and the fund gathers, for example, €30,000 in the first year."
        - "They decide together what to use it for. It can be a shared asset (machinery, research), forest maintenance, staff training or joint tourism promotion."
        - "Other sources can join once they see the landscape is already putting money in."

areas:
  - id: educacion
    label: { es: "Paisaje compartido", en: "Shared landscape" }
    text:
      es: "Que la transición se entienda, se quiera y se pueda visitar. Formación para quienes viven el paisaje, relato y fiestas que crean identidad, y una oferta turística que abre el territorio a quien viene de fuera."
      en: "So that the transition is understood, wanted and can be visited. Training for those who live the landscape, stories and festivals that build identity, and a tourism offer that opens it to visitors."
    tone: purple
    slug: educacion-cultura-turismo
    subareas:
      - id: edu
        label: { es: "Educación territorial", en: "Landscape education" }
        text:
          es: "Que niños y adultos entiendan su paisaje. Incluye el trabajo con escuelas y experiencias educativas en fincas, para todas las edades. La educación arraiga a las personas en el territorio, cambia perspectivas y forma a quienes serán sus ciudadanos de mañana."
          en: "So that children and adults understand their landscape. It includes work with schools and educational experiences on farms, for all ages. Education roots people in the landscape, changes perspectives and trains its citizens of tomorrow."
      - id: ofi
        label: { es: "Formación de profesionales locales", en: "Training local professionals" }
        text:
          es: "Preparar a las personas que el territorio necesita para sostener su transición: quien maneja una finca, quien vende lo que se produce, quien facilita los acuerdos entre actores. Abre salidas profesionales a quien quiere vivir y trabajar aquí, y da a las empresas y organizaciones del territorio personal capacitado."
          en: "Preparing the people the landscape needs to sustain its transition: whoever runs a farm, whoever sells what is produced, whoever facilitates agreements between actors. It opens career paths for those who want to live and work here, and gives the landscape's businesses and organisations trained staff."
      - id: eve
        label: { es: "Eventos y actividades culturales", en: "Cultural events and activities" }
        text:
          es: "Fiestas, festivales y experiencias que hacen del paisaje algo que se vive en común. Crean relato compartido y refuerzan el tejido social que sostiene la transición."
          en: "Festivals and experiences that make the landscape something lived in common. They build a shared story and strengthen the social fabric that sustains the transition."
  - id: forestal
    label: { es: "Gestión forestal", en: "Forest management" }
    text:
      es: "La mitad del territorio, y la que menos capital recibe. Estepa, monte y sierra sin gestión ni inversión. Aquí se decide dónde restaurar, cómo hacerlo y de qué puede vivir quien cuida el monte."
      en: "Half of the landscape, and the half that receives the least capital. Steppe, woodland and mountain without management or investment. Here it is decided where to restore, how, and what those who look after the forest can live on."
    tone: neural
    slug: zonas-naturales
    subareas:
      - id: est
        label: { es: "Estudios y planes forestales", en: "Forest studies and plans" }
        text:
          es: "Estudios de suelo, biodiversidad y corredores que orientan dónde y cómo restaurar para lograr más impacto."
          en: "Soil, biodiversity and corridor studies that guide where and how to restore for the most impact."
      - id: mon
        label: { es: "Cuidado del monte", en: "Forest stewardship" }
        text:
          es: "El equipo y el voluntariado que coordinan el trabajo en el monte día a día."
          en: "The team and volunteers who coordinate the day-to-day work in the forest."
      - id: res
        label: { es: "Restauración de zonas forestales", en: "Restoration of forest areas" }
        text:
          es: "Convertir suelo degradado en un ecosistema funcional y conectado. Plantar es solo el comienzo: sin mantenimiento y seguimiento durante años, lo plantado no prospera."
          en: "Turning degraded soil into a functioning, connected ecosystem. Planting is only the start: without years of maintenance and monitoring, what is planted does not thrive."
  - id: finca
    label: { es: "Agricultura regenerativa", en: "Regenerative agriculture" }
    text:
      es: "Donde la transición tiene que verse en la finca. Reúne lo que acompaña el cambio de manejo en las explotaciones agrícolas: conocimiento, formación, apoyo material, financiación de la transición y certificación."
      en: "Where the transition has to show on the farm. It brings together what supports the change of management on agricultural holdings: knowledge, training, material support, transition finance and certification."
    tone: tissue
    slug: agricultura-regenerativa
    subareas:
      - id: gen
        label: { es: "Generación de conocimiento agrícola", en: "Agricultural knowledge generation" }
        text:
          es: "Una finca experimental y estudios sobre purines, ganadería y razas autóctonas. Son la base para saber qué funciona, qué no y dónde merece la pena intervenir."
          en: "An experimental farm and studies on slurry, livestock and native breeds. They are the basis for knowing what works, what does not and where it is worth intervening."
      - id: for
        label: { es: "Formación y asistencia en finca", en: "On-farm training and assistance" }
        text:
          es: "Acompaña a quienes cultivan durante el cambio de manejo, para que aprendan unos de otros y no lo hagan solos: apoyo técnico en la propia finca, formación y espacios de encuentro."
          en: "Supports growers through the change of management so they learn from one another and do not do it alone: on-farm technical support, training and places to meet."
      - id: ins
        label: { es: "Insumos y servicios agrícolas", en: "Farm inputs and services" }
        text:
          es: "Recursos que las fincas comparten en lugar de tener cada una los suyos, como el compost comunitario o un banco de maquinaria. Reducen costes y barreras para quien quiere cambiar de manejo."
          en: "Resources that farms share instead of each having its own, such as community compost or a machinery bank. They lower costs and barriers for those who want to change management."
      - id: tra
        label: { es: "Transición regenerativa en finca", en: "On-farm regenerative transition" }
        text:
          es: "El cambio de manejo en la propia finca: cómo se trabaja el suelo, qué cubiertas se mantienen, cómo se cuida el agua y cómo se favorece la biodiversidad. Cuesta y baja el rendimiento al principio."
          en: "The change of management on the farm itself: how the soil is worked, which covers are kept, how water is looked after and how biodiversity is encouraged. It costs money and lowers yields at first."
      - id: cer
        label: { es: "Certificación regenerativa", en: "Regenerative certification" }
        text:
          es: "Certificación y estándares que respaldan el producto ante compradores y hacen verificable lo que ocurre en la finca."
          en: "Certification and standards that back the product with buyers and make what happens on the farm verifiable."
  - id: negocios
    label: { es: "Casos de negocio", en: "Business cases" }
    text:
      es: "Los negocios que dan salida a lo que producen las fincas: comercialización, transformación y los servicios que los sostienen."
      en: "The businesses that take what farms produce to market: marketing, processing and the services that sustain them."
    tone: yellow
    slug: casos-de-negocio
    subareas:
      - id: mer
        label: { es: "Estudios de mercado", en: "Market studies" }
        text:
          es: "Todo lo que ayuda a entender el mercado antes de invertir: mapear comercializadoras y plantas de transformación del territorio, seguir los precios de la almendra y otros productos, estudiar el valor añadido de cada producto."
          en: "Everything that helps understand the market before investing: mapping the landscape's marketers and processing plants, tracking almond and other product prices worldwide, studying each product's added value."
      - id: mar
        label: { es: "Desarrollo de marca y modelo de negocio", en: "Brand and business model development" }
        gap: true
        text:
          es: "Construye la marca y el modelo de negocio de las iniciativas del territorio, desde el destino turístico y el turismo regenerativo hasta los fondos de emprendimiento y los usos productivos del monte."
          en: "Builds the brand and the business model of the landscape's initiatives, from the tourist destination and regenerative tourism to entrepreneurship funds and productive uses of the forest."
      - id: cir
        label: { es: "Circulante y capital de trabajo", en: "Working capital" }
        gap: true
        text:
          es: "Quien comercializa adelanta los costes de la campaña y cobra poco a poco: ese desajuste entre lo que se gasta y lo que se cobra es el problema del circulante. El capital de trabajo cubre, además, los gastos recurrentes de funcionar todo el año."
          en: "Whoever markets advances the season's costs and is paid gradually: that mismatch between spending and income is the working-capital problem. Working capital also covers the recurring costs of operating all year."
      - id: inf
        label: { es: "Infraestructura de transformación", en: "Processing infrastructure" }
        gap: true
        text:
          es: "Los activos fijos para transformar los productos dentro del territorio. Transformar aquí retiene más valor, pero pide inversión."
          en: "The fixed assets to process products within the landscape. Processing here keeps more value, but it takes investment."

# Each area carries the portfolio's colour for it (src/lib/areas.ts: tone keys of the design system) and the
# slug of its page under /portafolio/. Agricultura regenerativa and Casos de negocio are separate areas there.
# The base: Tejido territorial. Its five sub-areas replace v1's four-part "Proceso de la estrategia" (diagnosis,
# strategy and structuring, coordination, project support), which is the same work.
base:
  id: tejido
  tone: flow
  slug: tejido-territorial
  label: { es: "Tejido territorial", en: "Landscape fabric" }
  text:
    es: "Las personas y las redes que mantienen en pie el trabajo del territorio. Equipos que sostienen a las organizaciones, redes que conectan actores y comunicación que cuenta lo que ocurre. Sin este tejido, las demás áreas no se sostienen."
    en: "The people and networks that keep the landscape's work standing. Teams that sustain organisations, networks that connect actors and communication that tells what is happening. Without this fabric, the other areas cannot hold."
  subareas:
    - id: coo
      label: { es: "Coordinación de redes y gobernanza", en: "Network coordination and governance" }
      text:
        es: "Reúne a actores con mandatos, recursos y ritmos distintos para que trabajen hacia una misma agenda, y hace visible el avance ante quienes financian o regulan."
        en: "Brings together actors with different mandates, resources and rhythms to work towards one agenda, and makes progress visible to funders and regulators."
    - id: ope
      label: { es: "Operaciones estructurales", en: "Core operations" }
      text:
        es: "Los equipos y los costes fijos que mantienen en pie a las organizaciones que sostienen el trabajo del territorio, entre un proyecto y el siguiente."
        en: "The teams and fixed costs that keep the organisations sustaining the landscape's work going between one project and the next."
    - id: dia
      label: { es: "Diagnóstico y medición de impacto", en: "Diagnosis and impact measurement" }
      text:
        es: "Entender el punto de partida del territorio: quién trabaja en él, qué iniciativas hay, qué financiación ya llega y cuál es el estado del suelo, el agua y la biodiversidad. Después, medir qué cambia con cada intervención."
        en: "Understanding the landscape's starting point: who works in it, which initiatives exist, what funding already arrives and the state of soil, water and biodiversity. Then measuring what changes with each intervention."
    - id: com
      label: { es: "Comunicación y difusión", en: "Communication and outreach" }
      text:
        es: "Cuenta lo que ocurre en el territorio a quienes pueden comprarlo, financiarlo o vivirlo. Refuerza el orgullo de quienes ya viven aquí."
        en: "Tells what is happening in the landscape to those who can buy it, fund it or live it. It strengthens the pride of those who already live here."
    - id: apo
      label: { es: "Impulso y apoyo técnico", en: "Boost and technical support" }
      text:
        es: "Acompaña a las iniciativas del territorio, con o sin modelo de negocio, hasta que están listas para recibir capital: prepara el modelo, las propuestas y las métricas, ayuda a acceder a financiación pública y privada, y diseña con ellas los mecanismos de financiación."
        en: "Accompanies the landscape's initiatives, with or without a business model, until they are ready for capital: it prepares the model, proposals and metrics, helps access public and private funding, and designs the financing mechanisms with them."
    - id: ife
      label: { es: "Influencia estratégica", en: "Strategic influence" }
      text:
        es: "Trabaja para influir en las estrategias y políticas que orientan el territorio y su financiación, como la PAC o las estrategias de los grupos de desarrollo rural (GDR), a favor de las prácticas regenerativas."
        en: "Works to influence the strategies and policies that shape the landscape and its funding, such as the CAP or the strategies of rural development groups (GDRs), in favour of regenerative practices."

