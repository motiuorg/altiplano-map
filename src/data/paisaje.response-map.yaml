# "Qué se está haciendo": which real interventions/organizations answer each theme.
# Matching, per theme:
#   workAreas  – interventions whose "Área de trabajo" equals one of these
#   keywords   – optional; when set, the intervention name/description must also
#                contain one of them (lets two themes share a work area)
#   orgNames   – organizations always shown for the theme (matched by exact name)
#   placeholders – shown ONLY when nothing real matches by name; they are
#                  labelled "ejemplo" on the page (names from the brief, not in
#                  the fixture)
themes:
  agua:
    workAreas: [Agricultura regenerativa]
    keywords: [secano, agua, hídric, riego]
    orgNames: [Comunidad de Aguas de Zújar]
    placeholders:
      - { name: Fondo Correcciones Hídricas, kind: Fondo, area: Agricultura regenerativa }
      - { name: Campaña Agua, kind: Campaña, area: Educación, cultura y turismo }
  suelo:
    workAreas: [Agricultura regenerativa]
    keywords: [semilla, pasto, ganado, pastoreo, carbono, suelo]
    orgNames: []
    placeholders:
      - { name: Fondo Semilla, kind: Fondo, area: Agricultura regenerativa }
      - { name: Proyecto de carbono (suelo), kind: Proyecto, area: Agricultura regenerativa }
  biodiversidad:
    workAreas: [Espacios naturales]
    keywords: []
    orgNames: [Estepa Viva — Custodia del Territorio]
    placeholders:
      - { name: Corredor Verde para la Biodiversidad, kind: Proyecto, area: Espacios naturales }
  uso_suelo:
    workAreas: [Articulación y desarrollo territorial, Articulación e impulso del territorio, Educación, cultura y turismo]
    keywords: []
    orgNames: []
    placeholders:
      - { name: Alma del Paisaje, kind: Programa, area: Educación, cultura y turismo }
