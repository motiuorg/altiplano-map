    tone: green
    pos: { x: 530, y: 476, w: 410 }
    mock: { y: 476, h: 292 }
    centre: true
    items:
      - { es: "Ganadería rotacional", en: "Rotational grazing" }
      - { es: "Más animales y razas diversas", en: "More animals and diverse breeds" }
