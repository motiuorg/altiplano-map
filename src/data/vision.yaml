# Visión regenerativa (/vision/): the restored territory as a tree, from the landscape in its crown down to
# its roots.
#
# Adapted from Andrea's design mockup "Versión árbol" (November 2026), which gathers what came out of
# collective workshops, interviews and research. The illustration is public/vision-arbol.svg, exported from
# the mockup without its sky, grass and soil, and with the roots drawn down to its bottom edge; the cards are laid over it. The Spanish is the mockup's own wording; the English is a
# translation.
#
# `pos` places each card or band on the illustration, in its own pixels (1440 wide): x, y = top-left
# corner, w = width (h, a minimum height, is optional: cards otherwise fit their content). `centre: true`
# places a row (the cards sharing its y) halfway between the bands above and below it, measured in the browser;
# y is then only the fallback. The list order is also the reading order on phones, where the
# illustration is hidden and the cards stack. A band sits between two layers: `up` is what the layer below
# gives (↑), `down` what the layer above gives back (↓). `tone` is one of the site's badge tones (pillars tissue,
# neural, flow; hues green, yellow, blue, purple, pink, red) or neutral. `mock` is where the mockup placed the card
# (the illustration leaves a gap there); the small preview on the home page draws simplified cards at that spot.

eyebrow: { es: "Visión regenerativa", en: "Regenerative vision" }
title: { es: "Así florece el territorio", en: "How the landscape flourishes" }
intro:
  es: "Un mapa de cómo imaginamos el territorio restaurado, desde las raíces hasta el paisaje. Reúne lo aprendido en talleres colectivos, entrevistas e investigación, y muestra cómo se sostienen entre sí las capas del territorio."
  en: "A map of how we imagine the restored Altiplano Estepario, from its roots up to the landscape. It brings together what we learned in collective workshops, interviews and research, and shows how its layers hold each other up."

size: { w: 1440, h: 2234 }

parts:
  - label: { es: "Paisaje restaurado", en: "Restored landscape" }
    sub: { es: "La tierra, el agua y la vida, en plena recuperación", en: "Land, water and life, well on the way back" }
    tone: yellow
    pos: { x: 270, y: 200, w: 900 }
    mock: { y: 200, h: 200 }
    items:
      - { es: "Suelo vivo", en: "Living soil" }
      - { es: "Biodiversidad creciente", en: "Growing biodiversity" }
      - { es: "Agua retenida", en: "Water held in the land" }
      - { es: "Corredor ecológico conectado", en: "A connected ecological corridor" }
      - { es: "Paisaje resiliente al fuego", en: "A fire-resilient landscape" }
      - { es: "El territorio como refugio climático", en: "The landscape as a climate refuge" }
  - band: { es: "Tierra viva", en: "Living land" }
    pos: { x: 645, y: 422, w: 150 }
    up: { es: "Restauran suelo, agua y biodiversidad", en: "They restore soil, water and biodiversity" }
    down: { es: "Devuelve suelo fértil, agua y refugio: cosechas, pastos y montes más seguros", en: "It gives back fertile soil, water and shelter: safer harvests, pastures and forests" }
  - label: { es: "Agricultura regenerativa", en: "Regenerative agriculture" }
    sub: { es: "Cultivos que producen, enseñan y cuidan", en: "Crops that produce, teach and care" }
    tone: tissue
    pos: { x: 105, y: 476, w: 410 }
    mock: { y: 476, h: 292 }
    centre: true
    items:
      - { es: "Fincas demostrativas", en: "Demonstration farms" }
      - { es: "Producción diversificada", en: "Diversified production" }
      - { es: "Transición acompañada", en: "A supported transition" }
  - label: { es: "Ganadería regenerativa", en: "Regenerative grazing" }
